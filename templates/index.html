<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikAPI Scraper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #fe2c55;
      --accent2: #25f4ee;
      --text: #f1f1f1;
      --text-muted: #888;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── SEARCH AREA ── */
    .search-area {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .search-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }
    .tab-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--text-muted); }

    .btn {
      padding: 12px 24px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-teal { background: var(--accent2); color: #000; }

    /* ── TOOLBAR ── */
    .toolbar {
      max-width: 1200px;
      margin: 0 auto 16px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar .count { color: var(--text-muted); font-size: 0.875rem; margin-right: auto; }

    /* ── PERFIL DO USUÁRIO ── */
    .user-card {
      max-width: 860px;
      margin: 0 auto 24px;
      padding: 0 16px;
    }
    .user-card-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-card-inner img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-info h2 { font-size: 1.1rem; }
    .user-info .handle { color: var(--text-muted); font-size: 0.875rem; }
    .user-stats { display: flex; gap: 20px; margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .user-stats span strong { color: var(--text); }

    /* ── GRID DE RESULTADOS ── */
    .results {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      transition: border-color 0.15s;
      cursor: pointer;
    }
    .card:hover { border-color: #444; }
    .card.selected { border-color: var(--accent); }
    .card.selected:hover { border-color: var(--accent); }

    .card-checkbox {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
      z-index: 2;
    }

    .card-thumb {
      position: relative;
      aspect-ratio: 9/16;
      background: #111;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-thumb .duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-body { padding: 10px 12px 12px; }

    .card-author {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .card-author img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }
    .card-author span { font-size: 0.8rem; color: var(--text-muted); }

    .keyword-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(37,244,238,0.12);
      color: var(--accent2);
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 6px;
      border: 1px solid rgba(37,244,238,0.25);
    }

    .card-desc {
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
      min-height: 2.3em;
    }

    .card-stats {
      display: flex;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .card-stats span { display: flex; align-items: center; gap: 3px; }

    .card-actions { display: flex; gap: 6px; }
    .card-actions .btn { padding: 6px 10px; font-size: 0.78rem; flex: 1; }

    /* ── ESTADO VAZIO / ERRO / LOADING ── */
    .state-msg {
      text-align: center;
      padding: 60px 16px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .state-msg .icon { font-size: 2.5rem; display: block; margin-bottom: 10px; }
    .state-msg.error { color: #ff6b6b; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MODAL DE PREVIEW ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-box {
      position: relative;
      width: 325px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-box iframe {
      display: block;
      width: 100%;
      height: 740px;
      border: none;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 0.875rem;
      z-index: 99;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.25s;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: var(--accent2); color: var(--accent2); }
    #toast.error { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
    <circle cx="16" cy="16" r="16" fill="#fe2c55"/>
    <path d="M20 10v8a4 4 0 1 1-4-4V10h4z" fill="white"/>
    <circle cx="20" cy="10" r="2.5" fill="#25f4ee"/>
  </svg>
  <h1>TikAPI Scraper</h1>
  <div id="quotaBadge" style="margin-left:auto;display:flex;align-items:center;gap:10px;">
    <div style="font-size:0.8rem;color:var(--text-muted);">Requests hoje</div>
    <div id="quotaBar" style="width:140px;height:8px;background:var(--border);border-radius:4px;overflow:hidden;">
      <div id="quotaFill" style="height:100%;width:0%;background:var(--accent2);border-radius:4px;transition:width 0.4s;"></div>
    </div>
    <div id="quotaText" style="font-size:0.85rem;font-weight:600;min-width:60px;text-align:right;">—</div>
  </div>
</header>

<div class="search-area">
  <div class="search-tabs">
    <button class="tab-btn active" data-mode="keyword">Palavra-chave</button>
    <button class="tab-btn" data-mode="user">Username (@)</button>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput"
      placeholder="Ex: fitness, receitas saudáveis, academia"
      autocomplete="off"
    />
    <button class="btn btn-primary" id="searchBtn">Buscar</button>
  </div>
  <div id="searchHint" style="margin-top:8px;font-size:0.8rem;color:var(--text-muted);line-height:1.6;">
    <span id="hintKeyword">
      Use <kbd style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:0.75rem;">vírgula</kbd>
      para buscar múltiplas palavras-chave de uma vez.
      Ex: <span style="color:var(--text);cursor:pointer;" onclick="fillExample('fitness, receitas fit, treino em casa')">
        <u>fitness, receitas fit, treino em casa</u>
      </span>
    </span>
    <span id="hintUser" style="display:none;">
      Digite o @ do perfil sem o arroba.
      Ex: <span style="color:var(--text);cursor:pointer;" onclick="fillExample('nike')">
        <u>nike</u>
      </span>
    </span>
  </div>
</div>

<div id="userCard" class="user-card" style="display:none"></div>

<div class="toolbar" id="toolbar" style="display:none">
  <span class="count" id="countLabel"></span>
  <button class="btn btn-secondary" id="selectAllBtn">Selecionar todos</button>
  <button class="btn btn-primary" id="downloadBtn">⬇ Baixar selecionados</button>
</div>

<div class="results" id="results">
  <div class="state-msg">
    <span class="icon">🔍</span>
    Faça uma busca para ver os resultados.
  </div>
</div>

<div id="loadMoreArea" style="display:none;text-align:center;padding:16px 0 40px;">
  <button class="btn btn-secondary" id="loadMoreBtn" style="min-width:180px;">
    Carregar mais
  </button>
</div>

<div class="modal-overlay" id="previewModal" onclick="closePreview(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closePreview()">✕</button>
    <iframe id="previewFrame" src="" allowfullscreen
      allow="autoplay; encrypted-media"></iframe>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── Quota ───────────────────────────────────────────────
  async function updateQuota(quota) {
    if (!quota) {
      const res = await fetch('/api/quota').catch(() => null);
      if (!res || !res.ok) return;
      quota = await res.json();
    }
    const pct = quota.limit > 0 ? Math.min(100, (quota.used / quota.limit) * 100) : 0;
    const remaining = quota.remaining;
    const fill = document.getElementById('quotaFill');
    const text = document.getElementById('quotaText');
    fill.style.width = pct + '%';
    // Verde → amarelo → vermelho conforme o uso aumenta
    if (pct < 60) fill.style.background = 'var(--accent2)';
    else if (pct < 85) fill.style.background = '#f9a825';
    else fill.style.background = 'var(--accent)';
    text.textContent = `${remaining} restantes`;
    text.style.color = pct >= 85 ? 'var(--accent)' : 'var(--text)';
  }

  function fillExample(text) {
    document.getElementById('searchInput').value = text;
    document.getElementById('searchInput').focus();
  }

  // Carrega quota ao abrir a página
  updateQuota();

  // ── Estado ──────────────────────────────────────────────
  let mode = 'keyword';      // 'keyword' | 'user'
  let allSelected = false;
  let items = [];            // lista de vídeos carregados
  let currentQuery = '';     // última query feita
  let nextCursor = '';       // cursor para próxima página
  let hasMore = false;       // se há mais resultados disponíveis
  let videoCookie = '';      // tt_chain_token necessário para download
  let seenVideoIds = new Set(); // evita duplicatas ao paginar

  // ── Utilitários ─────────────────────────────────────────
  function fmt(n) {
    if (!n) return '0';
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
    return String(n);
  }

  function fmtDuration(s) {
    if (!s) return '';
    const m = Math.floor(s / 60);
    const sec = String(s % 60).padStart(2, '0');
    return `${m}:${sec}`;
  }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.className = '', 3000);
  }

  // ── Tabs ────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      const input = document.getElementById('searchInput');
      input.placeholder = mode === 'user'
        ? 'Ex: nike   (sem o @)'
        : 'Ex: fitness, receitas saudáveis, academia';
      document.getElementById('hintKeyword').style.display = mode === 'user' ? 'none' : 'inline';
      document.getElementById('hintUser').style.display   = mode === 'user' ? 'inline' : 'none';
    });
  });

  // ── Busca ───────────────────────────────────────────────
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    showLoading();
    document.getElementById('userCard').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('loadMoreArea').style.display = 'none';
    items = [];
    seenVideoIds = new Set();
    currentQuery = q;
    nextCursor = '';
    hasMore = false;

    try {
      let data;
      if (mode === 'user') {
        const res = await fetch(`/api/search/user?username=${encodeURIComponent(q)}`);
        data = await res.json();
        if (!res.ok) { showError(data.error || 'Erro desconhecido'); return; }
        renderUserCard(data.user);
        items = data.posts || [];
      } else {
        const keywords = q.split(',').map(k => k.trim()).filter(Boolean);
        const isMulti = keywords.length > 1;
        const endpoint = isMulti
          ? `/api/search/multi?q=${encodeURIComponent(q)}`
          : `/api/search/keyword?q=${encodeURIComponent(q)}`;

        const res = await fetch(endpoint);
        data = await res.json();
        if (!res.ok) { showError(data.error || 'Erro desconhecido'); return; }
        items = data.items || [];
        nextCursor = data.cursor || '';
        hasMore = data.hasMore || false;

        // Mostra resumo por keyword em busca múltipla
        if (isMulti && data.keywordCounts) {
          const summary = Object.entries(data.keywordCounts)
            .map(([kw, n]) => `<strong>${kw}</strong>: ${n}`)
            .join(' &nbsp;·&nbsp; ');
          document.getElementById('countLabel').dataset.summary = summary;
        }
      }

      if (data.quota) updateQuota(data.quota);
      if (data.videoHeaders) videoCookie = data.videoHeaders.Cookie || '';

      renderItems(items);
      updateLoadMore();
    } catch (err) {
      showError('Falha na conexão com o servidor.');
    }
  }

  async function loadMore() {
    if (!hasMore || !nextCursor || !currentQuery) return;

    const btn = document.getElementById('loadMoreBtn');
    btn.disabled = true;
    btn.textContent = 'Carregando…';

    try {
      const res = await fetch(
        `/api/search/keyword?q=${encodeURIComponent(currentQuery)}&cursor=${encodeURIComponent(nextCursor)}`
      );
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Erro ao carregar mais.', 'error'); return; }

      const newItems = data.items || [];
      nextCursor = data.cursor || '';
      hasMore = data.hasMore || false;
      items = items.concat(newItems);

      if (data.quota) updateQuota(data.quota);
      if (data.videoHeaders) videoCookie = data.videoHeaders.Cookie || '';

      appendItems(newItems);
      updateLoadMore();
    } catch (err) {
      toast('Falha ao carregar mais resultados.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Carregar mais';
    }
  }

  function updateLoadMore() {
    const area = document.getElementById('loadMoreArea');
    // Só mostra o botão em buscas por palavra-chave (user não tem paginação na API)
    area.style.display = (hasMore && mode === 'keyword') ? 'block' : 'none';
  }

  document.getElementById('loadMoreBtn').addEventListener('click', loadMore);

  // ── Renderizar perfil ───────────────────────────────────
  function renderUserCard(userInfo) {
    if (!userInfo || !userInfo.user) return;
    const u = userInfo.user;
    const s = userInfo.stats || {};
    const card = document.getElementById('userCard');
    card.style.display = 'block';
    card.innerHTML = `
      <div class="user-card-inner">
        <img src="${u.avatarThumb || u.avatarLarger || ''}" alt="${u.nickname}"
             onerror="this.src='https://placehold.co/64x64/1a1a1a/888?text=?'" />
        <div class="user-info">
          <h2>${u.nickname || u.uniqueId}</h2>
          <div class="handle">@${u.uniqueId}</div>
          <div class="user-stats">
            <span><strong>${fmt(s.followerCount)}</strong> seguidores</span>
            <span><strong>${fmt(s.heartCount)}</strong> curtidas</span>
            <span><strong>${fmt(s.videoCount)}</strong> vídeos</span>
          </div>
        </div>
      </div>
    `;
  }

  // ── Renderizar vídeos ───────────────────────────────────
  function buildCards(list) {
    return list.map((item, idx) => {
      const v = item.video || {};
      const a = item.author || {};
      const s = item.stats || item.statistics || {};
      const thumb = v.cover || v.originCover || v.dynamicCover || '';
      const downloadUrl = v.playAddr || v.downloadAddr || v.play || '';
      const tiktokLink = `https://www.tiktok.com/@${a.uniqueId}/video/${item.id}`;
      const filename = `tiktok_${a.uniqueId || 'video'}_${item.id}.mp4`;
      return `
        <div class="card" data-idx="${idx}" data-url="${encodeURIComponent(downloadUrl)}" data-filename="${filename}"
             onclick="toggleCard(event, this)">
          <input type="checkbox" class="card-checkbox" onchange="onCheck(this)" />
          <div class="card-thumb">
            <img src="${thumb}" alt="thumb"
                 onerror="this.src='https://placehold.co/220x391/111/444?text=📹'" />
            ${v.duration ? `<span class="duration">${fmtDuration(v.duration)}</span>` : ''}
          </div>
          <div class="card-body">
            ${item._keyword ? `<div><span class="keyword-badge">${item._keyword}</span></div>` : ''}
            <div class="card-author">
              <img src="${a.avatarThumb || a.avatarLarger || a.avatarMedium || ''}" alt="${a.uniqueId}"
                   onerror="this.src='https://placehold.co/24x24/1a1a1a/888?text=?'" />
              <span>@${a.uniqueId || '—'}</span>
            </div>
            <div class="card-desc">${item.desc || '(sem descrição)'}</div>
            <div class="card-stats">
              <span>❤️ ${fmt(s.diggCount || s.likeCount)}</span>
              <span>💬 ${fmt(s.commentCount)}</span>
              <span>↗️ ${fmt(s.shareCount)}</span>
            </div>
            <div class="card-actions">
              <button class="btn btn-secondary"
                onclick="openPreview('${item.id}')">▶ Ver</button>
              <button class="btn btn-secondary"
                onclick="copyLink('${tiktokLink}')">🔗</button>
              <button class="btn btn-primary"
                onclick="downloadOne('${encodeURIComponent(downloadUrl)}', '${filename}')">⬇</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function appendItems(list) {
    const unique = list.filter(item => {
      if (!item.id || seenVideoIds.has(item.id)) return false;
      seenVideoIds.add(item.id);
      return true;
    });
    if (unique.length === 0) return;
    const container = document.getElementById('results');
    container.insertAdjacentHTML('beforeend', buildCards(unique));
    document.getElementById('countLabel').textContent = `${items.length} vídeo(s) encontrado(s)`;
  }

  function renderItems(list) {
    const container = document.getElementById('results');

    if (!list || list.length === 0) {
      container.innerHTML = `
        <div class="state-msg">
          <span class="icon">😶</span>
          Nenhum resultado encontrado.
        </div>`;
      return;
    }

    document.getElementById('toolbar').style.display = 'flex';
    const label = document.getElementById('countLabel');
    const summary = label.dataset.summary || '';
    label.innerHTML = `${list.length} vídeo(s) encontrado(s)`
      + (summary ? `<br><span style="font-size:0.78rem;color:var(--text-muted)">${summary}</span>` : '');
    label.dataset.summary = '';
    // Registra IDs da primeira página para deduplicar nas próximas
    list.forEach(item => { if (item.id) seenVideoIds.add(item.id); });
    container.innerHTML = buildCards(list);
  }

  // ── Selecionar ──────────────────────────────────────────
  function toggleCard(event, card) {
    // Ignora cliques originados nos botões de ação ou no próprio checkbox
    if (event.target.closest('button') || event.target.closest('input[type="checkbox"]')) return;
    const cb = card.querySelector('.card-checkbox');
    cb.checked = !cb.checked;
    card.classList.toggle('selected', cb.checked);
    updateSelectBtn();
  }

  function onCheck(cb) {
    const card = cb.closest('.card');
    card.classList.toggle('selected', cb.checked);
    updateSelectBtn();
  }

  function updateSelectBtn() {
    const total = document.querySelectorAll('.card-checkbox').length;
    const checked = document.querySelectorAll('.card-checkbox:checked').length;
    allSelected = checked === total;
    document.getElementById('selectAllBtn').textContent =
      allSelected ? 'Desmarcar todos' : 'Selecionar todos';
  }

  document.getElementById('selectAllBtn').addEventListener('click', () => {
    allSelected = !allSelected;
    document.querySelectorAll('.card-checkbox').forEach(cb => {
      cb.checked = allSelected;
      cb.closest('.card').classList.toggle('selected', allSelected);
    });
    updateSelectBtn();
  });

  // ── Download ─────────────────────────────────────────────
  function downloadOne(encodedUrl, filename) {
    if (!encodedUrl || encodedUrl === 'undefined') {
      toast('URL de download não disponível para este vídeo.', 'error');
      return;
    }
    let url = `/api/download?url=${encodedUrl}&filename=${encodeURIComponent(filename)}`;
    if (videoCookie) url += `&cookie=${encodeURIComponent(videoCookie)}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    toast(`Baixando ${filename}…`);
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const selected = document.querySelectorAll('.card.selected');
    if (selected.length === 0) {
      toast('Selecione pelo menos um vídeo.', 'error');
      return;
    }
    selected.forEach((card, i) => {
      // Pequeno delay entre downloads para não sobrecarregar
      setTimeout(() => {
        downloadOne(card.dataset.url, card.dataset.filename);
      }, i * 600);
    });
    toast(`Iniciando ${selected.length} download(s)…`);
  });

  // ── Copiar link ──────────────────────────────────────────
  function copyLink(url) {
    navigator.clipboard.writeText(url)
      .then(() => toast('Link copiado!'))
      .catch(() => toast('Não foi possível copiar.', 'error'));
  }

  // ── Preview ──────────────────────────────────────────────
  function openPreview(videoId) {
    document.getElementById('previewFrame').src =
      `https://www.tiktok.com/embed/v2/${videoId}`;
    document.getElementById('previewModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePreview(event) {
    // Fecha ao clicar no overlay (fundo escuro), não no modal em si
    if (event && event.target !== document.getElementById('previewModal')) return;
    document.getElementById('previewFrame').src = '';
    document.getElementById('previewModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Fecha com Esc
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePreview();
  });

  // ── Estados de UI ────────────────────────────────────────
  function showLoading() {
    document.getElementById('results').innerHTML = `
      <div class="state-msg">
        <div class="spinner"></div>
        Buscando…
      </div>`;
  }

  function showError(msg) {
    document.getElementById('results').innerHTML = `
      <div class="state-msg error">
        <span class="icon">⚠️</span>
        ${msg}
      </div>`;
  }
</script>
</body>
</html>
