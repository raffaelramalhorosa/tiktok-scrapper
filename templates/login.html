<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikAPI Scraper — Acesso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fe2c55, #25f4ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #2e2e2e;
      background: #242424;
      color: #f1f1f1;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #fe2c55; }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #fe2c55;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .error {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(254,44,85,0.1);
      border: 1px solid rgba(254,44,85,0.3);
      color: #fe2c55;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#fe2c55"/>
        <path d="M20 10v8a4 4 0 1 1-4-4V10h4z" fill="white"/>
        <circle cx="20" cy="10" r="2.5" fill="#25f4ee"/>
      </svg>
      <h1>TikAPI Scraper</h1>
    </div>
    <label for="password">Senha de acesso</label>
    <form method="POST">
      <input type="password" id="password" name="password"
             placeholder="Digite a senha" autofocus />
      <button type="submit">Entrar</button>
    </form>
    {% if error %}
    <div class="error">Senha incorreta. Tente novamente.</div>
    {% endif %}
  </div>
</body>
</html>
